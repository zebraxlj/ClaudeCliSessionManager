[project]
name = "claude-session-manager"
version = "0.1.0"
description = "A PyQt5 GUI to browse, preview, and delete Claude Code CLI session files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyQt5>=5.15",
    "Send2Trash>=1.8",
    # The newest PyQt5-Qt5 builds only publish Linux/macOS wheels; 5.15.2 is
    # the last version with a Windows (win_amd64) wheel.
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
]

[project.scripts]
claude-session-manager = "claude_session_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_session_manager"]
